name: Deploy RNGdle to GitHub Pages

# Keeps https://nomnomsnom.github.io/factor-extractor/ current.
#
# Publishes by committing the built page to the `gh-pages` branch rather than
# using the Actions Pages source: pushing that branch auto-enables Pages, while
# the Actions source has to be switched on by hand in repo settings.

on:
  push:
    branches: [main]
    paths:
      - 'rngdle/**'
      - '.github/workflows/rngdle-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

# Never let two publishes race; a queued run supersedes an in-flight one.
concurrency:
  group: rngdle-pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Don't publish a broken game: the suite covers the scoring rules, parity
      # with rngdle.com's own badge table, and the page's default settings.
      - name: Test
        working-directory: rngdle
        run: node --test "test/**/*.test.mjs"

      # Inlines CSS, the ES modules and the generated EP table into one
      # self-contained page with no imports and no network requests.
      - name: Bundle
        working-directory: rngdle
        run: node tools/bundle.mjs

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages
          git worktree add ../site origin/gh-pages
          cp rngdle/dist/rngdle.html ../site/index.html
          touch ../site/.nojekyll
          cd ../site
          git add -A
          if git diff --cached --quiet; then
            echo "site is already up to date"
            exit 0
          fi
          git commit -m "Publish RNGdle from ${GITHUB_SHA:0:7}"
          git push origin HEAD:gh-pages
