name: Publish the agent graph

# Publishes the agent graph to
# https://nomnomsnom.github.io/factor-extractor/agent-graph/
#
# This repo's Pages source is "Deploy from a branch" -> gh-pages, which holds a
# hand-published index.html (rngdle). So this workflow writes into that branch
# rather than using actions/deploy-pages, which only works when the source is
# set to "GitHub Actions".
#
# It touches agent-graph/ and nothing else. rngdle's index.html on gh-pages is
# currently ahead of rngdle/ on main, so rebuilding and republishing it from
# here would downgrade the live game — see the note in agent_graph/README.md.

on:
  push:
    branches: [main]
    paths:
      - 'agent_graph/**'
      - 'tests/test_agent_graph.py'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-agent-graph
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A second working tree for the publish branch. Checking it out this way
      # rather than switching branches in place keeps the build tree intact and
      # lets the action set up push credentials for us.
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .gh-pages

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install Python dependencies
        run: pip install -r agent_graph/requirements.txt

      # Don't publish a broken graph: the topology and guardrails, plus the
      # arithmetic the browser build evaluates without a server.
      - name: Test
        run: |
          python -m pytest tests/test_agent_graph.py -q
          node --test agent_graph/ui/engine.test.mjs
          node --test rngdle/test/*.test.mjs

      # Inlines the stylesheet, the three scripts, and the schema and prompts
      # read straight out of config.py and prompts.py, so the published page
      # cannot drift from the Python implementation.
      - name: Bundle
        run: python -m agent_graph.bundle

      - name: Publish to gh-pages
        working-directory: .gh-pages
        run: |
          set -euo pipefail
          mkdir -p agent-graph
          cp ../agent_graph/dist/agent-graph.html agent-graph/index.html

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Only ever stage this one path — everything else on gh-pages,
          # rngdle's index.html included, is published by hand.
          git add agent-graph/index.html
          if git diff --cached --quiet; then
            echo "no change to publish"
            exit 0
          fi
          git commit -m "Publish agent graph from ${GITHUB_SHA::7}"
          git push origin HEAD:gh-pages
